<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">PrimeCare Department Information Exchange</title>
  <desc id="desc">Hub-and-spoke diagram based on Section 6.2: Patient Services, Medical, Laboratory, Pharmacy, Finance and Billing, and Administration exchange information through the integrated HIS.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eafaf7"/><stop offset="1" stop-color="#edf0ff"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
    <linearGradient id="hub" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#06b6d4"/><stop offset=".55" stop-color="#0d9488"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="node1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9fbf2"/></linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfeaff"/></linearGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ebe2ff"/></linearGradient>
    <linearGradient id="node4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcf7e6"/></linearGradient>
    <linearGradient id="node5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fff1d6"/></linearGradient>
    <linearGradient id="node6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe1ee"/></linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8f7e8"/><stop offset="1" stop-color="#e4ecff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#7c3aed"/></marker>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.14"/></filter>
  </defs>

  <rect width="1200" height="860" rx="22" fill="url(#page)"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="40" y="30" width="268" height="26" rx="13" fill="#0d9488"/>
    <text x="174" y="48" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ffffff">DEPARTMENT INFORMATION EXCHANGE</text>
    <text x="40" y="88" font-size="27" font-weight="800" fill="url(#titleGrad)">One patient record, shared across every department</text>
    <text x="40" y="108" font-size="13" fill="#475569">Section 6.2 — Two-way exchanges remove repeated data entry and speed up patient service.</text>

    <g filter="url(#soft)">
      <circle cx="600" cy="445" r="112" fill="url(#hub)"/>
    </g>
    <circle cx="600" cy="445" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="600" y="424" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">INTEGRATED HIS</text>
    <text x="600" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Centralized Database</text>
    <rect x="536" y="468" width="128" height="22" rx="11" fill="#ffffff" fill-opacity="0.2"/>
    <text x="600" y="483" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#ffffff">SECURE NETWORK</text>

    <g filter="url(#soft)" font-family="'Segoe UI', Arial, sans-serif">
      <g>
        <rect x="490" y="117" width="220" height="96" rx="16" fill="url(#node1)" stroke="#5eead4"/>
        <rect x="490" y="141" width="5" height="48" rx="2.5" fill="#0d9488"/>
        <text x="512" y="158" font-size="15" font-weight="800" fill="#0f766e">Patient Services</text>
        <text x="512" y="181" font-size="11.5" fill="#475569">Registration · Patient ID</text>
      </g>
      <g>
        <rect x="855" y="267" width="220" height="96" rx="16" fill="url(#node2)" stroke="#93c5fd"/>
        <rect x="855" y="291" width="5" height="48" rx="2.5" fill="#2563eb"/>
        <text x="877" y="308" font-size="15" font-weight="800" fill="#1d4ed8">Medical Department</text>
        <text x="877" y="331" font-size="11.5" fill="#475569">History · Consultation</text>
      </g>
      <g>
        <rect x="855" y="537" width="220" height="96" rx="16" fill="url(#node3)" stroke="#c4b5fd"/>
        <rect x="855" y="561" width="5" height="48" rx="2.5" fill="#7c3aed"/>
        <text x="877" y="578" font-size="15" font-weight="800" fill="#6d28d9">Laboratory</text>
        <text x="877" y="601" font-size="11.5" fill="#475569">Test requests · Results</text>
      </g>
      <g>
        <rect x="490" y="687" width="220" height="96" rx="16" fill="url(#node4)" stroke="#6ee7b7"/>
        <rect x="490" y="711" width="5" height="48" rx="2.5" fill="#059669"/>
        <text x="512" y="728" font-size="15" font-weight="800" fill="#047857">Pharmacy</text>
        <text x="512" y="751" font-size="11.5" fill="#475569">Prescriptions · Stock update</text>
      </g>
      <g>
        <rect x="125" y="537" width="220" height="96" rx="16" fill="url(#node5)" stroke="#fcd34d"/>
        <rect x="125" y="561" width="5" height="48" rx="2.5" fill="#d97706"/>
        <text x="147" y="578" font-size="15" font-weight="800" fill="#b45309">Finance &amp; Billing</text>
        <text x="147" y="601" font-size="11.5" fill="#475569">Charges · Insurance claims</text>
      </g>
      <g>
        <rect x="125" y="267" width="220" height="96" rx="16" fill="url(#node6)" stroke="#f9a8d4"/>
        <rect x="125" y="291" width="5" height="48" rx="2.5" fill="#db2777"/>
        <text x="147" y="308" font-size="15" font-weight="800" fill="#be185d">Administration</text>
        <text x="147" y="331" font-size="11.5" fill="#475569">Reports · Performance</text>
      </g>
    </g>

    <!-- Department connectors drawn on top so every arrowhead stays visible -->
    <g stroke="url(#conn)" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="600" y1="213" x2="600" y2="333"/>
      <line x1="855" y1="354" x2="705" y2="407"/>
      <line x1="855" y1="543" x2="705" y2="485"/>
      <line x1="600" y1="687" x2="600" y2="557"/>
      <line x1="345" y1="543" x2="495" y2="485"/>
      <line x1="345" y1="354" x2="495" y2="407"/>
    </g>

    <rect x="40" y="806" width="1120" height="36" rx="12" fill="url(#foot)" stroke="#a7f3d0"/>
    <text x="600" y="829" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Every exchange is authenticated, access-controlled, encrypted, backed up, and audit-logged · Compliant with RA 10173</text>
  </g>
</svg>
